# GDELT pour renforcer les aires non occidentales (Sprint 2).
# On lit les fichiers bruts publies toutes les 15 minutes (GKG 2.1 : presse en anglais
# et presse traduite de 65 langues). Pas de limite de requetes, contrairement a l'API.
# Citation obligatoire dans l'application : "The GDELT Project" (gdeltproject.org).
actif: oui
fichiers_max: 28        # tranches de 15 minutes lues au plus par passage (28 = 7 heures)
max_par_aire: 40        # articles gardes au plus par aire et par passage (les plus riches en themes)
themes_min: 3           # nombre minimal de themes utiles portes par l'article

# Aires gardees (les autres sont deja bien couvertes par les flux RSS)
aires_cibles: [CN, JK, IN, ASE, RU, GO, MO, AF, LA]

# Themes GDELT utiles (prefixes) : environnement et energie, economie et monnaie,
# technologie et science, themes de la Banque mondiale (developpement, infrastructures...)
themes: [ENV_, ECON_, TECH_, SCIENCE, WB_, AGRICULTURE, FOOD_SECURITY, WATER_SECURITY, CYBER_, TAX_FNCACT_ENGINEER]
# Themes "forts" : un article qui en porte au moins un est dans le champ, et prioritaire.
# On y met aussi les evolutions de societe (Fourquet, Todd) : education, travail, famille, ville...
themes_forts: [ENV_, ECON_, TECH_, SCIENCE, AGRICULTURE, FOOD_SECURITY, WATER_SECURITY, CYBER_,
               EDUCATION, UNEMPLOYMENT, POVERTY, IMMIGRATION, MIGRATION, URBAN, RURAL, HOUSING,
               SOC_, LABOR, UNION, WOMEN, AGING, YOUTH, RELIGION, HEALTH_, MEDICAL, WELFARE, TAX_DISEASE]
part_libre: 0.25        # un quart des articles de chaque aire est tire au hasard parmi les autres :
                        # "un peu de bruit", pour ne pas filtrer ce qu'on n'attendait pas

# Rubriques hors champ, reconnues dans l'adresse de l'article
exclure_si_url_contient: [horoscope, goroskop, rashifal, /astro, /sport, celebrit]   # le reste peut passer dans la part libre

# L'aire de la source se deduit : 1) de cette liste de sites connus,
# 2) de l'extension nationale du site (.cn, .ng, .br...), 3) de la langue d'origine.
