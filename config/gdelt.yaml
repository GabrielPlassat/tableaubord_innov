# Requetes GDELT pour renforcer les aires peu couvertes par les flux RSS (Sprint 2).
# GDELT traduit les articles en anglais : les mots-cles sont donc en anglais,
# mais les articles trouves sont dans leur langue d'origine.
# Citation obligatoire dans l'application : "The GDELT Project" (gdeltproject.org).
# GDELT limite a une requete toutes les 5 secondes et refuse souvent les adresses
# partagees de GitHub : on fait donc peu de requetes, chacune sur plusieurs pays.
# Pour ajouter un pays : l'ajouter a un groupe (nom anglais en minuscules, sans espace : aire).
actif: oui
pause_s: 10           # entre deux requetes
pause_refus_s: 20     # apres un refus : 20 s, puis 40 s
essais: 3
duree_max_s: 300      # GDELT ne doit pas retarder la collecte de plus de 5 minutes
periode: 6h           # aligne sur le rythme de la collecte
max_articles: 250     # par requete (250 au plus)
mots: '(technology OR innovation OR energy OR battery OR semiconductor OR "electric vehicle" OR infrastructure OR currency OR climate OR mining)'
requetes:
  - nom: chine
    pays: {china: CN, hongkong: CN}
  - nom: japon-coree-taiwan
    pays: {japan: JK, southkorea: JK, taiwan: JK}
  - nom: golfe-moyen-orient
    pays: {saudiarabia: GO, unitedarabemirates: GO, qatar: GO, iran: MO, turkey: MO, egypt: MO}
