# Quel modele pour quelle tache. Les identifiants Albert changent : verifiez-les
# avec le carnet notebooks/sprint1_test_albert.ipynb (liste GET /v1/models).
albert:
  adresse: https://albert.api.etalab.gouv.fr/v1
  # Pour changer de modele : remplacer le nom ci-dessous par un autre de la liste
  # GET /v1/models (affichee par le carnet). La meme cle Albert sert pour tous.
  tri: ministral-3-8b-instruct-2512              # passe 1 (choix du 14/11/2026)
  fiche: mistral-small-3-2-24b-instruct-2506     # passe 2 : lentille, iceberg, nature, aire, resume
  consigne_fiche: v5                             # config/consignes/passe2_v5.txt (16/11/2026)
  secours: [gemma-4-31b-it, deepseek-v4-flash-0731]  # essayes dans l'ordre si le modele choisi disparait
  vecteurs: bge-m3                     # embeddings multilingues disponibles sur Albert (a confirmer au Sprint 3)
claude:
  secours_classement: claude-haiku-5-5
  synthese_hebdo: claude-opus-5-5
  etiquettes_agents: claude-opus-5-5   # axe, pole, precipitation, rebond, par lots (Batch)
  agents_mensuels: claude-fable-5-2   # en traitement differe (Batch)
  assistant: claude-sonnet-5-5
  dossiers: claude-fable-5-2
