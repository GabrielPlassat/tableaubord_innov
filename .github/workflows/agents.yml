# Agents du lundi (Sprint 4) : etiquetage des sujets de la semaine par Opus (traitement differe).
# Lancement manuel : onglet Actions > "Agents" > Run workflow.
# Secrets : HF_TOKEN, ANTHROPIC_API_KEY. Plafond : config/budget.yaml (arret a 60 $ par mois).
name: Agents

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * 1"     # chaque lundi a 7 h 17 UTC, apres le calcul des sujets de la nuit
  push:
    branches-ignore: [main]  # essai sur une branche quand le script ou la consigne change
    paths:
      - scripts/etiqueter_sujets.py
      - config/consignes/a0_*.txt

permissions:
  contents: write

concurrency:
  group: agents
  cancel-in-progress: false

jobs:
  agents:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements-collecte.txt
      - run: pip install -r scripts/requirements-collecte.txt
      - name: Etiqueter les sujets
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -u scripts/etiqueter_sujets.py
      - name: Enregistrer le journal et les couts
        if: always()
        run: |
          git config user.name "innovation-radar-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A journal/agents.csv journal/couts.csv journal/etiquettes_bilan.csv journal/batch_en_attente.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Agents du $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && break; sleep 5; done
