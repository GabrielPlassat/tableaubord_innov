# Evaluation du classement d'Albert sur le jeu de reference de 100 articles (Sprint 3).
# Lancement manuel : onglet Actions > "Evaluation du classement" > Run workflow.
# Se relance aussi quand une consigne, le script ou le jeu de reference change.
# Secret : ALBERT_API_KEY. Environ 300 appels a Albert, 20 a 40 minutes.
name: Evaluation du classement

on:
  workflow_dispatch:
  push:
    paths:
      - config/consignes/**
      - config/modeles.yaml
      - scripts/classement.py
      - scripts/evaluer_classement.py
      - tests/reference_100.csv

permissions:
  contents: write

concurrency:
  group: evaluation
  cancel-in-progress: true

jobs:
  evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements-collecte.txt
      - run: pip install -r scripts/requirements-collecte.txt
      - name: Evaluer
        env:
          ALBERT_API_KEY: ${{ secrets.ALBERT_API_KEY }}
        run: python -u scripts/evaluer_classement.py
      - name: Enregistrer le bilan
        if: always()
        run: |
          git config user.name "innovation-radar-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add journal/evaluation_sprint3.csv docs/evaluation-sprint3.md 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Evaluation du classement du $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && break; sleep 5; done
