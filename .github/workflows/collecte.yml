# Collecte des articles toutes les 6 heures (Sprint 2, sans classement).
# Lancement manuel : onglet Actions > "Collecte" > Run workflow.
# Secret necessaire : HF_TOKEN (jeton Hugging Face avec droit d'ecriture).
name: Collecte

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */3 * * *"   # toutes les 3 heures : GitHub saute souvent des passages planifies

permissions:
  contents: write

concurrency:
  group: collecte          # jamais deux collectes en meme temps
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements-collecte.txt
      - run: pip install -r scripts/requirements-collecte.txt
      - name: Collecter
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/collecte.py
      - name: Enregistrer le journal
        if: always()
        run: |
          git config user.name "innovation-radar-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add journal/executions.csv journal/collecte_sources.csv journal/gdelt_dernier_fichier.txt journal/stock_du_mois.csv config/sources.csv 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Collecte du $(date -u +'%F %H:%M') UTC"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
